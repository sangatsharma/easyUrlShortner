<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and Meta Description with multiple keywords -->
    <title>
      URL Shortener - Short URL, Shorten Your Links Instantly With Link
      Management
    </title>
    <meta
      name="description"
      content="Create a short URL easily with EasyURL.me, the best URL shortener. Manage links, track clicks, and streamline your sharing process with our efficient tool."
    />

    <!-- Open Graph Meta Tags for better social media sharing -->
    <meta
      property="og:title"
      content="Easy URL Shortener - Short URL, URL Shortener"
    />
    <meta
      property="og:description"
      content="Shorten your links instantly with EasyURL.me. Manage, track clicks, and analyze your URL performance effortlessly."
    />
    <meta
      property="og:image"
      content="https://www.easyurl.me/assets/og-image.png"
    />
    <meta property="og:url" content="https://www.easyurl.me" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Easy URL Shortener - Short URL, URL Shortener"
    />
    <meta
      name="twitter:description"
      content="Shorten your links quickly and track clicks easily with EasyURL.me. Try our URL shortener for better link management."
    />
    <meta
      name="twitter:image"
      content="https://www.easyurl.me/assets/twitter-image.png"
    />

    <!-- Favicon and icon links -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Robots Meta Tag to control crawling behavior -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL to avoid duplicate content issues -->
    <!-- <link rel="canonical" href="https://www.easyurl.me" /> -->

    <!-- Preload for faster resource loading -->
    <link rel="preload" href="/styles.css" as="style" />
    <link
      rel="preload"
      href="/fonts/font.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React App Script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

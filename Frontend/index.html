<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title and Meta Description -->
  <title>Easy URL Shortener - Shorten Your Links Instantly</title>
  <meta name="description" content="Shorten your URLs easily with EasyURL.me. Manage links, track clicks, and streamline your sharing process." />

  <!-- Open Graph Meta Tags for better social media sharing -->
  <meta property="og:title" content="Easy URL Shortener" />
  <meta property="og:description" content="Manage your links, shorten URLs easily, and track performance at EasyURL.me." />
  <meta property="og:image" content="https://www.easyurl.me/assets/og-image.png" />
  <meta property="og:url" content="https://www.easyurl.me" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Easy URL Shortener" />
  <meta name="twitter:description" content="Shorten your links in seconds and track clicks easily with EasyURL.me." />
  <meta name="twitter:image" content="https://www.easyurl.me/assets/twitter-image.png" />

  <!-- Favicon and icon links -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Robots Meta Tag to control crawling behavior -->
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL to avoid duplicate content issues -->
  <link rel="canonical" href="https://www.easyurl.me" />

  <!-- CSS Preload for faster load (optional) -->
  <link rel="preload" href="/styles.css" as="style" />
  <link rel="preload" href="/fonts/font.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

  <!-- Open Graph for social media sharing (like Facebook) -->
  <meta property="og:image" content="https://www.easyurl.me/assets/og-image.png" />

</head>

<body>
  <div id="root"></div>

  <!-- Main React App Script -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
